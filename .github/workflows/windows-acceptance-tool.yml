name: Build the Windows VM acceptance tool
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the existing real-runtime acceptance harness
        run: cargo build --release -p stackcabin-core --example native-smoke
      - name: Prepare the portable test kit
        shell: pwsh
        run: |
          $directory = 'artifacts/windows-acceptance'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Copy-Item target/release/examples/native-smoke.exe $directory
          Copy-Item scripts/Invoke-StackCabinAcceptance.ps1 $directory
          Copy-Item docs/VM_ACCEPTANCE.md $directory
          Copy-Item LICENSE $directory
          $hash = (Get-FileHash "$directory/native-smoke.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  native-smoke.exe" | Set-Content "$directory/SHA256SUMS.txt" -Encoding utf8
          git rev-parse HEAD | Set-Content "$directory/SOURCE_COMMIT.txt" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vm-acceptance
          retention-days: 7
          path: artifacts/windows-acceptance/
