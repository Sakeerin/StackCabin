name: Verify an existing development installer on the baseline
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Build and verify development installers run ID
        type: string
        required: true
      runner:
        type: choice
        options: [windows-latest, ubuntu-24.04, macos-14]
        required: true
      arch:
        description: macOS package architecture; x64 requires preinstalled Rosetta
        type: choice
        options: [arm64, x64]
        default: arm64
permissions:
  contents: read
  actions: read
jobs:
  verify:
    # The macOS 14 hosted image retires on 2 November 2026.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: development-installers-${{ startsWith(inputs.runner, 'windows') && 'windows-latest' || startsWith(inputs.runner, 'ubuntu') && 'ubuntu-22.04' || inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/installers/
      - name: Verify downloaded installer checksums
        shell: bash
        run: python scripts/verify-installer-checksums.py artifacts/installers --platform "$RUNNER_OS"
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: "24"
      - name: Install and verify the Windows prerequisite and application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/prepare-windows-prerequisites.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Prerequisite preparation failed' }
          $before = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./src-tauri/windows/install-vc-runtime.ps1 -PayloadDirectory ./artifacts/windows-prerequisites -Manifest ./runtime-catalog/windows-prerequisites.json -CheckOnly | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Prerequisite inspection failed' }
          $installers = @(Get-ChildItem artifacts/installers/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'installed preview ทดสอบ'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $after = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./src-tauri/windows/install-vc-runtime.ps1 -PayloadDirectory ./artifacts/windows-prerequisites -Manifest ./runtime-catalog/windows-prerequisites.json -CheckOnly | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $after.installationNeeded) { throw 'Installer did not provide the required Visual C++ version' }
          Write-Output "PASS Visual C++ before=$($before.installedVersion), needed=$($before.installationNeeded), after=$($after.installedVersion)"
          ./scripts/smoke-packaged-windows.ps1 -Application (Join-Path $destination 'stackcabin.exe') -Python (Get-Command python).Source
      - name: Install the Ubuntu 22.04 deb on Ubuntu 24.04
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(artifacts/installers/deb/*.deb)
          test "${#packages[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 "./${packages[0]}"
          xvfb-run -a dbus-run-session -- python scripts/smoke-packaged.py /usr/bin/stackcabin
      - name: Execute the same AppImage without FUSE
        if: runner.os == 'Linux'
        shell: bash
        run: |
          images=(artifacts/installers/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          chmod +x "${images[0]}"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- python scripts/smoke-packaged.py "${images[0]}"
      - name: Verify x64 compatibility support
        if: runner.os == 'macOS' && inputs.arch == 'x64'
        run: arch -x86_64 /usr/bin/true
      - name: Mount the DMG and start its application on macOS 14
        if: runner.os == 'macOS'
        shell: bash
        run: |
          images=(artifacts/installers/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          mount="$RUNNER_TEMP/stackcabin-dmg"
          destination="$RUNNER_TEMP/installed preview ทดสอบ"
          mkdir "$mount" "$destination"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${images[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          apps=("$mount"/*.app)
          test "${#apps[@]}" -eq 1
          ditto "${apps[0]}" "$destination/StackCabin.app"
          hdiutil detach "$mount"
          trap - EXIT
          python scripts/check-macos-bundle.py "$destination/StackCabin.app"
          python scripts/smoke-packaged.py "$destination/StackCabin.app/Contents/MacOS/stackcabin"
