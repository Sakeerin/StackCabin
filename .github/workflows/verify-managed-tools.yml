name: Verify managed Node toolchains on macOS
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Current Apple Silicon or native Intel hosted runner
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
      arch:
        description: ARM runner target; x64 uses Rosetta, Intel runners always use x64
        type: choice
        options: [arm64, x64]
        default: arm64
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Select the x64 compatibility target
        if: inputs.runner == 'macos-15' && inputs.arch == 'x64'
        run: |
          arch -x86_64 /usr/bin/true
          rustup target add x86_64-apple-darwin
          echo "CARGO_BUILD_TARGET=x86_64-apple-darwin" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Install and execute each managed Node version and package manager
        env:
          STACKCABIN_SMOKE_DIR: ${{ github.workspace }}/.local/native smoke ทดสอบ
          STACKCABIN_SMOKE_COMPONENTS: node,caddy,pnpm,yarn
        run: cargo run -p stackcabin-core --example native-smoke
