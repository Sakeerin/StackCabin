name: Prepare reviewed native release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unique future native-* release tag; nothing is published
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify release preparation regressions
        run: node --test scripts/test-native-release.mjs scripts/test-native-stack.mjs .github/tests/native-release-verification.test.mjs
      - name: Download the exact reviewed producers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { releaseBase, releaseSelections, verifyProducer } from './scripts/prepare-native-release.mjs';
          const repository = process.env.GITHUB_REPOSITORY;
          releaseBase(repository, process.env.RELEASE_TAG);
          const builds = releaseSelections(JSON.parse(await readFile('.github/native-test-builds.json', 'utf8')));
          const api = (endpoint) => JSON.parse(execFileSync('gh', ['api', `repos/${repository}/${endpoint}`], { encoding: 'utf8' }));
          const runs = new Map();
          const inputs = [];
          for (const build of builds) {
            if (!runs.has(build.run)) runs.set(build.run, api(`actions/runs/${build.run}`));
            const run = runs.get(build.run);
            verifyProducer(run, build, repository);
            const matches = api(`actions/runs/${build.run}/artifacts?per_page=100`).artifacts.filter((a) => a.name === build.artifact && !a.expired);
            if (matches.length !== 1) throw new Error(`Missing/expired/ambiguous native artifact: ${build.id}`);
            const directory = path.resolve('artifacts/native-release-inputs', build.id);
            await mkdir(directory, { recursive: true });
            execFileSync('gh', ['run', 'download', String(build.run), '--repo', repository, '--name', build.artifact, '--dir', directory], { stdio: 'inherit' });
            inputs.push({ id: build.id, directory, run });
          }
          await writeFile('artifacts/native-release-inputs.json', JSON.stringify(inputs, null, 2));
          NODE
      - name: Assemble unsigned unpublished release candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/prepare-native-release.mjs --input=artifacts/native-release-inputs.json --output=artifacts/native-release --repository="$GITHUB_REPOSITORY" --tag="$RELEASE_TAG"
      - name: Recheck every staged asset including the completion manifest
        working-directory: artifacts/native-release
        run: sha256sum --check SHA256SUMS.txt
      - name: Retain independently verified small review evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { copyFile, mkdir, readFile, readdir, writeFile } from 'node:fs/promises';
          import { verifyCandidate } from './.github/scripts/verify-native-release.mjs';
          const directory = 'artifacts/native-release';
          const evidence = 'artifacts/native-release-evidence';
          const manifestSha256 = createHash('sha256').update(await readFile(`${directory}/release-manifest.json`)).digest('hex');
          const { report } = await verifyCandidate(directory, { repository: process.env.GITHUB_REPOSITORY, tag: process.env.RELEASE_TAG, manifestSha256 });
          await mkdir(evidence);
          await writeFile(`${evidence}/candidate-verification.json`, JSON.stringify(report, null, 2) + '\n', { flag: 'wx' });
          for (const name of await readdir(directory)) {
            if (name.endsWith('.json') || ['SHA256SUMS.txt', 'RELEASE_REVIEW.txt'].includes(name))
              await copyFile(`${directory}/${name}`, `${evidence}/${name}`);
          }
          console.log(JSON.stringify({ manifestSha256, files: report.fileCount, hosted: report.hostedVerification.result }));
          NODE
      - uses: actions/upload-artifact@v4
        id: candidate
        with:
          name: reviewed-native-release-candidate
          retention-days: 7
          if-no-files-found: error
          path: artifacts/native-release/
      - name: Bind small evidence to the uploaded candidate artifact
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_URL: ${{ steps.candidate.outputs.artifact-url }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          const directory = 'artifacts/native-release-evidence';
          const candidate = JSON.parse(await readFile(`${directory}/candidate-verification.json`, 'utf8'));
          const sha256 = process.env.CANDIDATE_ARTIFACT_DIGEST.replace(/^sha256:/, '');
          const artifactId = process.env.CANDIDATE_ARTIFACT_ID;
          if (!/^[1-9]\d*$/.test(artifactId) || !/^[a-f0-9]{64}$/.test(sha256)) throw new Error('Missing candidate upload identity/digest');
          const receipt = { schemaVersion: 1, sourceCommit: process.env.GITHUB_SHA, workflowRun: process.env.GITHUB_RUN_ID,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            artifactId, artifactUrl: process.env.CANDIDATE_ARTIFACT_URL, sha256, manifestSha256: candidate.manifestSha256 };
          await writeFile(`${directory}/ARTIFACT_RECEIPT.json`, JSON.stringify(receipt, null, 2) + '\n', { flag: 'wx' });
          const lines = [];
          for (const name of (await readdir(directory)).sort())
            lines.push(`${createHash('sha256').update(await readFile(`${directory}/${name}`)).digest('hex')}  ${name}\n`);
          await writeFile(`${directory}/EVIDENCE_SHA256SUMS.txt`, lines.join(''), { flag: 'wx' });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-verification
          retention-days: 7
          if-no-files-found: error
          path: artifacts/native-release-evidence/
