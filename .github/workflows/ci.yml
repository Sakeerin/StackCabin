name: Verify StackCabin
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          [windows-latest, ubuntu-22.04, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native packaging helper tests
        run: python -m unittest discover -s scripts -p test_native_runtime.py -v
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libsecret-1-dev xvfb dbus-x11
      - run: npm ci
      - run: node scripts/verify-catalog.mjs
      - run: node --test scripts/test-catalog.mjs
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p stackcabin-core
      - name: Generated interfaces are current
        shell: bash
        run: cargo run -p stackcabin-core --bin export-types && git diff --exit-code -- src/lib/types.ts
      - name: Build native application
        run: node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json
      - name: Desktop end-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Desktop end-to-end tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          retention-days: 3
          path: |
            target/debug/stackcabin.exe
            target/debug/stackcabin
            dist/
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux core dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libsecret-1-dev
      - name: Real runtime installation, HTTP health, and shutdown
        env:
          STACKCABIN_SMOKE_DIR: ${{ github.workspace }}/.local/native smoke ทดสอบ
          STACKCABIN_SMOKE_COMPONENTS: ${{ runner.os == 'Windows' && 'node,caddy,php,cacert,composer,pnpm,yarn' || 'node,caddy,pnpm,yarn' }}
        run: cargo run -p stackcabin-core --example native-smoke
