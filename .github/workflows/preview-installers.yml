name: Build and verify development installers
on:
  workflow_dispatch:
    inputs:
      target:
        description: Rebuild only the packages needing verification
        type: choice
        options: [all, macos, macos-arm64, macos-x64, linux, windows]
        default: all
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'macos' && '["macos-15","macos-15-intel"]' || inputs.target == 'macos-arm64' && '["macos-15"]' || inputs.target == 'macos-x64' && '["macos-15-intel"]' || inputs.target == 'linux' && '["ubuntu-22.04"]' || inputs.target == 'windows' && '["windows-latest"]' || '["windows-latest","ubuntu-22.04","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libsecret-1-dev xvfb dbus-x11
      - run: npm ci
      - name: Verify the development catalog
        run: node scripts/verify-catalog.mjs
      - name: Build normal installers without E2E plugins
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) bundles=nsis ;;
            Linux) bundles=deb,appimage ;;
            macOS) bundles=app,dmg ;;
          esac
          node node_modules/@tauri-apps/cli/tauri.js build --bundles "$bundles"
      - name: Install and start the Windows preview in the disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --test scripts/test-windows-prerequisites.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Prerequisite integrity tests failed' }
          $installer = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'StackCabin-preview'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $report = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./src-tauri/windows/install-vc-runtime.ps1 -PayloadDirectory ./artifacts/windows-prerequisites -Manifest ./runtime-catalog/windows-prerequisites.json -CheckOnly | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $report.installationNeeded) { throw 'Installer did not provide the required Visual C++ runtime' }
          Write-Output "PASS installed Visual C++ $($report.installedVersion), required $($report.requiredVersion)"
          ./scripts/smoke-packaged-windows.ps1 -Application (Join-Path $destination 'stackcabin.exe') -Python (Get-Command python).Source
      - name: Install and start the Ubuntu package in the disposable runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          sudo dpkg -i "${packages[0]}"
          xvfb-run -a dbus-run-session -- python scripts/smoke-packaged-unix.py /usr/bin/stackcabin
      - name: Start the normal macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary=$(find target/release/bundle/macos -path '*/Contents/MacOS/stackcabin' -type f)
          test -n "$binary"
          python scripts/check-macos-bundle.py "$(dirname "$(dirname "$(dirname "$binary")")")"
          python scripts/smoke-packaged-unix.py "$binary"
      - name: Installer checksums
        if: always() && !cancelled()
        run: node scripts/release-checksums.mjs
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: development-installers-${{ matrix.os }}
          retention-days: 7
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/SHA256SUMS.txt
